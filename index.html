<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#172033">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>Табло очков</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f6fa;color:#172033}
main{max-width:760px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:1.45rem;margin:8px 0}button,input{font:inherit}button{padding:10px 14px;border:1px solid #cbd2df;background:white;border-radius:12px;cursor:pointer}
button.primary{background:#172033;color:white;border-color:#172033;width:100%;font-weight:700;padding:13px}
.tabs{display:flex;gap:8px;margin:16px 0}.tabs button.active{background:#172033;color:white}
.player{background:white;border:1px solid #e0e5ed;border-radius:16px;padding:14px;margin:12px 0}
.playerline{display:flex;justify-content:space-between;align-items:center;gap:12px}
.score{font-size:1.25rem;font-weight:750;padding:8px 14px;border-radius:12px}
input[type=number]{width:100%;min-width:0;padding:10px;border:1px solid #cbd2df;border-radius:10px}
.editrow{display:flex;gap:8px;margin-top:12px}.editrow input{flex:1}
.msg{padding:12px;border-radius:12px;margin:10px 0}.bad{background:#fee2e2;color:#991b1b}.good{background:#dcfce7;color:#166534}
.history{overflow-x:auto;background:white;border-radius:12px}table{border-collapse:collapse;width:100%;min-width:520px}th,td{border:1px solid #dfe3ea;padding:8px;text-align:center}th{background:#eef1f6}
.small{font-size:.88rem;color:#657086}#history{margin-top:8px}
</style>
</head>
<body><main>
<header><h1>🏆 Табло очков</h1><button id="add">＋ Участник</button></header>
<button id="backup">💾 Резервная копия</button>
<div class="tabs"><button id="tabPlayers" class="active">Игроки</button><button id="tabHistory">История</button></div>
<div id="msg"></div><section id="players"></section><section id="history" hidden></section><section id="controls"></section>
<p class="small">Данные сохраняются на этом устройстве в браузере. Экспорт/резервное копирование пока не предусмотрены.</p>
</main><script src="app.js"></script></body></html>
