name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'app.js'
      - 'manifest.json'
      - 'sw.js'
      - 'icon.svg'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare web assets and Capacitor
        run: |
          mkdir -p www
          cp index.html app.js manifest.json sw.js icon.svg www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init Scoreboard com.fps28.scoreboard --web-dir=www
          npx cap add android

      - name: Fix Kotlin dependency conflict
        run: |
          cat >> android/build.gradle <<'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency {
                      if (it.requested.group == 'org.jetbrains.kotlin') {
                          it.useVersion '1.8.22'
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: scoreboard-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
